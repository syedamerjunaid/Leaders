apiVersion: apps/v1
kind: Deployment
metadata:
  name: community
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community
  template:
    metadata:
      labels:
        app: community
    spec:
      containers:
      - name: community
        image: community:latest  # Must match your local Docker image
        imagePullPolicy: Never  # Prevents Kubernetes from trying to pull from a registry
        ports:
        - containerPort: 5002