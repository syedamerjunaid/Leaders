name: Deploy React Frontend

on:
  push:
    branches:
      - nextgenmuslims # Change this if using a different branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ✅ Fixes history issues

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: Frontend/nextgenmuslims-frontend

      - name: Build React App
        run: npm run build
        working-directory: Frontend/nextgenmuslims-frontend

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: Frontend/nextgenmuslims-frontend/build
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true  # ✅ Ensures old files don’t cause conflicts
