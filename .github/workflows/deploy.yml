name: Deploy React Frontend

on:
  push:
    branches:
      - nextgenmuslims  # Change this if your branch is different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # ✅ Fix GitHub permission issues
          fetch-depth: 0  # ✅ Fixes history issues

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: Frontend/nextgenmuslims-frontend

      - name: Build React App
        run: npm run build
        working-directory: Frontend/nextgenmuslims-frontend

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          git commit -m "Deploying to GitHub Pages" || echo "No changes to commit"
          git push origin gh-pages --force
