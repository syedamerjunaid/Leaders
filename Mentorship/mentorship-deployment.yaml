apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentorship
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mentorship
  template:
    metadata:
      labels:
        app: mentorship
    spec:
      containers:
      - name: mentorship
        image: mentorship:latest  # Must match your local Docker image
        imagePullPolicy: Never  # Prevents Kubernetes from trying to pull from a registry
        ports:
        - containerPort: 5005
