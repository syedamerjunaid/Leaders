apiVersion: v1
kind: Service
metadata:
  name: mentorship
spec:
  selector:
    app: mentorship
  ports:
    - protocol: TCP
      port: 5005      # Service inside Kubernetes
      targetPort: 5005  # Your FastAPI app port
      nodePort: 30005   # External access (change if needed)
  type: NodePort  # This makes it accessible outside Kubernetes
