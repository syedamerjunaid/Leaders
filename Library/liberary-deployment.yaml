apiVersion: apps/v1
kind: Deployment
metadata:
  name: library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library
  template:
    metadata:
      labels:
        app: library
    spec:
      containers:
      - name: library
        image: library:latest  # Must match your local Docker image
        imagePullPolicy: Never  # Prevents Kubernetes from trying to pull from a registry
        ports:
        - containerPort: 5004
